name: Release

# Every manifest version that reaches main without a GitHub release yet is signed on AMO and published.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Skip released versions
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "v${{ steps.version.outputs.version }} is already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.released.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.released.outputs.skip != 'true'
        run: npm ci

      - if: steps.released.outputs.skip != 'true'
        run: npm run lint

      - name: Sign on AMO
        if: steps.released.outputs.skip != 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign

      - name: Publish GitHub release
        if: steps.released.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp web-ext-artifacts/*-"$VERSION".xpi "github-deslop-$VERSION.xpi"
          gh release create "v$VERSION" "github-deslop-$VERSION.xpi" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
