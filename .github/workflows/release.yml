name: Release

# Every manifest version that reaches master without a GitHub release yet is signed on AMO and published.
# A prerelease carrying the dev add-on and a Chromium zip comes first, so the build is installable while AMO review is pending.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Read release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! prerelease=$(gh release view "v${{ steps.version.outputs.version }}" --json isPrerelease --jq .isPrerelease 2> /dev/null); then
            echo "state=none" >> "$GITHUB_OUTPUT"
          elif [ "$prerelease" = true ]; then
            echo "state=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "v${{ steps.version.outputs.version }} is already released"
            echo "state=released" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.release.outputs.state != 'released'
        with:
          node-version: 24
          cache: npm

      - if: steps.release.outputs.state != 'released'
        run: npm ci

      - if: steps.release.outputs.state != 'released'
        run: npm run lint

      - name: Sign the dev add-on
        if: steps.release.outputs.state == 'none'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign -- --dev

      - name: Publish GitHub prerelease
        if: steps.release.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp web-ext-artifacts/dev/*-"$VERSION".xpi "github-deslop-dev-$VERSION.xpi"
          (cd extension && zip -r "../github-deslop-chromium-$VERSION.zip" .)
          gh release create "v$VERSION" "github-deslop-dev-$VERSION.xpi" "github-deslop-chromium-$VERSION.zip" --prerelease --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

      - name: Sign on AMO
        if: steps.release.outputs.state != 'released'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npm run sign

      - name: Publish GitHub release
        if: steps.release.outputs.state != 'released'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp web-ext-artifacts/*-"$VERSION".xpi "github-deslop-$VERSION.xpi"
          gh release upload "v$VERSION" "github-deslop-$VERSION.xpi"
          gh release edit "v$VERSION" --prerelease=false --latest
